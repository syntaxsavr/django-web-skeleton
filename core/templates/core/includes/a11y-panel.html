<div id="a11y-modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="a11y-modal-title">
    <h2 id="a11y-modal-title">Accessibility</h2>
    <p class="modal-note">Display options for this device. Saved locally, never sent anywhere.</p>
    <div class="a11y-options">
      <button type="button" class="a11y-option" data-a11y-action="toggle-dark">
        <span>Dark mode</span><small>Invert paper and ink.</small>
      </button>
      <button type="button" class="a11y-option" data-a11y-action="toggle-contrast">
        <span>High contrast</span><small>Stronger lines, harder text.</small>
      </button>
      <button type="button" class="a11y-option" data-a11y-action="toggle-text">
        <span>Larger text</span><small>Cycle 100%, 110%, 125%.</small>
      </button>
      <button type="button" class="a11y-option" data-a11y-action="toggle-motion">
        <span>Reduce motion</span><small>Stop animations and reveals.</small>
      </button>
      <button type="button" class="a11y-option" data-a11y-action="print-page">
        <span>Print page</span><small>Open the print edition.</small>
      </button>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-modal-cancel>Close</button>
    </div>
  </div>
</div>
