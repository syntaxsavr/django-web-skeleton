{% extends "core/base.html" %}
{% load static %}
{% block body_class %}page-auth{% endblock %}
{% block robots %}<meta name="robots" content="noindex, follow">{% endblock %}
{% block page_css %}<link rel="stylesheet" href="{% static 'core/css/pages/auth.css' %}">{% endblock %}
{% block content %}
<section class="section auth-section">
  <div class="shell shell-narrow auth-card">
    <h1>Choose a new password</h1>
    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="form-field pw-field">
        <label for="id_new_password1">New password</label>
        <input type="password" name="new_password1" id="id_new_password1" autocomplete="new-password" required><button type="button" class="pw-eye" data-password-view="id_new_password1" aria-label="Show or hide password" title="Show password"></button>
      </div>
      <div class="form-field">
        <label for="id_new_password2">Repeat new password</label>
        <input type="password" name="new_password2" id="id_new_password2" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save password</button>
    </form>
  </div>
</section>
{% endblock %}
{% block extra_js %}<script defer src="{% static 'core/js/password-toggle.js' %}"></script>{% endblock %}
