{% extends "core/base.html" %}
{% load static %}
{% block body_class %}page-auth{% endblock %}
{% block robots %}<meta name="robots" content="noindex, follow">{% endblock %}
{% block page_css %}<link rel="stylesheet" href="{% static 'core/css/pages/auth.css' %}">{% endblock %}
{% block content %}
<section class="section auth-section">
  <div class="shell shell-narrow auth-card">
    <h1>Reset password</h1>
    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="form-field">
        <label for="id_email">Email</label>
        <input type="email" name="email" id="id_email" autocomplete="email" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
    </form>
  </div>
</section>
{% endblock %}
