{% extends "admin/change_list.html" %}

{% block result_list %}
  {% if changelist_description %}
  <div class="admin-help-banner">
    <strong>What is this?</strong> {{ changelist_description }}
  </div>
  {% endif %}
  {% if changelist_preview_url %}
  <div class="admin-preview-split">
    <div class="admin-preview-results">
      {{ block.super }}
    </div>
    <div class="admin-preview-pane">
      <div class="admin-preview-bar">
        <span class="admin-preview-dot"></span><span class="admin-preview-dot"></span><span class="admin-preview-dot"></span>
        <span class="admin-preview-label">Live preview of the saved site</span>
        <a class="admin-preview-open" href="{{ changelist_preview_url }}" target="_blank" rel="noopener" title="Open the page in a new tab"><span class="material-symbols-outlined">open_in_new</span></a>
      </div>
      <iframe class="admin-preview-frame" src="{{ changelist_preview_url }}" title="Live preview of {{ changelist_preview_url }}"></iframe>
    </div>
  </div>
  {% else %}
  {{ block.super }}
  {% endif %}
{% endblock %}
