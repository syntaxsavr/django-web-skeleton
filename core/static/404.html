{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b0d10;--text:#f2f4f8;--muted:#a8b0bd;--accent:#4d7fff;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
.stage{text-align:center;max-width:520px}
.code{font-family:var(--mono);font-size:clamp(4.4rem,14vw,7.5rem);font-weight:700;line-height:1;margin:0;color:var(--accent);text-shadow:0 0 44px rgba(77,127,255,.4)}
h1{font-size:clamp(1.4rem,3vw,2rem);margin:14px 0 8px}
p{color:var(--muted)}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:30px}
a{display:inline-flex;align-items:center;min-height:44px;padding:10px 22px;border-radius:8px;font-weight:600;text-decoration:none}
.primary{background:var(--accent);color:#fff}
.ghost{border:1px solid rgba(255,255,255,.16);color:var(--text)}
@media (prefers-reduced-motion:no-preference){.code{animation:float 5s ease-in-out infinite}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}}
</style>
</head>
<body>
<main class="stage">
<p class="code" aria-hidden="true">404</p>
<h1>Nothing at this address</h1>
<p>The page moved, never existed, or the link has a typo.</p>
<p class="actions">
<a class="primary" href="/">Back to the start page</a>
<a class="ghost" href="/demo/">Show me the demo</a>
</p>
</main>
</body>
</html>
