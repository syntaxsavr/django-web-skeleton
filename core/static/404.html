{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
:root{--paper:#fcfcfa;--ink:#0a0a0a;--muted:#575752;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
.stage{max-width:640px;width:100%}
.code{font-size:clamp(7rem,26vw,17rem);font-weight:500;line-height:.75;letter-spacing:-.05em;margin:0;border-bottom:2px solid var(--ink);padding-bottom:.06em}
h1{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:clamp(1.8rem,5vw,3rem);margin:28px 0 10px}
p{color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
a{display:inline-flex;align-items:center;min-height:46px;padding:11px 24px;border:1px solid var(--ink);font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;background:var(--ink);color:var(--paper)}
a.ghost{background:transparent;color:var(--ink)}
a:hover{text-decoration:none}
</style>
</head>
<body>
<main class="stage">
<p class="code" aria-hidden="true">404</p>
<h1>Nothing at this address.</h1>
<p>The page moved, never existed, or the link has a typo.</p>
<p class="actions">
<a href="/">Back to the index</a>
<a class="ghost" href="/demo/">Show me the demo</a>
</p>
</main>
</body>
</html>
